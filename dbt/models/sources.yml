version: 2

sources:
  - name: sales
    database: AdventureWorks2014
    schema: Sales
    description: "Sales domain tables from AdventureWorks2014 OLTP database"
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 7300, period: day}
    loaded_at_field: ModifiedDate
    tables:
      - name: SalesOrderHeader
        description: "General sales order information (dates, customer, territory, status, totals)."
        columns:
          - name: SalesOrderID
            description: "Primary key for sales order."
          - name: OrderDate
            description: "Date the order was created."
          - name: Status
            description: "Order current status (1=In Process, 2=Approved, 3=Backordered, 4=Rejected, 5=Shipped, 6=Cancelled)."
          - name: CustomerID
            description: "Customer identification number."
          - name: TerritoryID
            description: "Territory in which the sale was made."
          - name: TotalDue
            description: "Total due from customer."
          - name: ModifiedDate
            description: "Date and time the record was last updated."

      - name: SalesOrderDetail
        description: "Individual products associated with a specific sales order."
        columns:
          - name: SalesOrderID
            description: "Primary key. Foreign key to SalesOrderHeader.SalesOrderID."
          - name: SalesOrderDetailID
            description: "Primary key. One incremental unique number per product sold."
          - name: OrderQty
            description: "Quantity ordered per product."
          - name: ProductID
            description: "Product sold to customer. Foreign key to Production.Product."
          - name: UnitPrice
            description: "Selling price of a single product."
          - name: UnitPriceDiscount
            description: "Discount amount percentage."
          - name: LineTotal
            description: "Per product subtotal."
          - name: ModifiedDate
            description: "Date and time the record was last updated."

      - name: SalesTerritory
        description: "Sales territory lookup table."
        columns:
          - name: TerritoryID
            description: "Primary key for SalesTerritory records."
          - name: Name
            description: "Sales territory description."
          - name: CountryRegionCode
            description: "ISO standard country or region code."
          - name: Group
            description: "Geographic area to which the sales territory belongs."
          - name: SalesYTD
            description: "Sales in the territory year to date."
          - name: SalesLastYear
            description: "Sales in the territory the previous year."
          - name: ModifiedDate
            description: "Date and time the record was last updated."

      - name: Customer
        description: "Current customer information."
        columns:
          - name: CustomerID
            description: "Primary key."
          - name: PersonID
            description: "Foreign key to Person.Person."
          - name: StoreID
            description: "Foreign key to Sales.Store."
          - name: TerritoryID
            description: "ID of the territory in which the customer is located."
          - name: AccountNumber
            description: "Unique number identifying the customer."
          - name: ModifiedDate
            description: "Date and time the record was last updated."

      - name: Store
        description: "Customers (resellers) of Adventure Works products."
        columns:
          - name: BusinessEntityID
            description: "Primary key. Foreign key to Person.BusinessEntity."
          - name: Name
            description: "Name of the store."
          - name: SalesPersonID
            description: "ID of the sales person assigned to the customer."
          - name: ModifiedDate
            description: "Date and time the record was last updated."

  - name: production
    database: AdventureWorks2014
    schema: Production
    description: "Production & product catalog tables from AdventureWorks2014"
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 7300, period: day}
    loaded_at_field: ModifiedDate
    tables:
      - name: Product
        description: "Products sold or used in the manufacturing of sold products."
        columns:
          - name: ProductID
            description: "Primary key for Product records."
          - name: Name
            description: "Name of the product."
          - name: ProductNumber
            description: "Unique product identification number (SKU)."
          - name: StandardCost
            description: "Standard cost of the product."
          - name: ListPrice
            description: "Selling price."
          - name: ProductSubcategoryID
            description: "Product is a member of this product subcategory."
          - name: ModifiedDate
            description: "Date and time the record was last updated."

      - name: ProductSubcategory
        description: "Product subcategories."
        columns:
          - name: ProductSubcategoryID
            description: "Primary key for ProductSubcategory records."
          - name: ProductCategoryID
            description: "Product category identification number."
          - name: Name
            description: "Subcategory description."
          - name: ModifiedDate
            description: "Date and time the record was last updated."

      - name: ProductCategory
        description: "High-level product categorization."
        columns:
          - name: ProductCategoryID
            description: "Primary key for ProductCategory records."
          - name: Name
            description: "Category description."
          - name: ModifiedDate
            description: "Date and time the record was last updated."

  - name: person
    database: AdventureWorks2014
    schema: Person
    description: "Person & contact tables from AdventureWorks2014"
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 7300, period: day}
    loaded_at_field: ModifiedDate
    tables:
      - name: Person
        description: "Human beings involved with AdventureWorks: employees, customer contacts, and vendor contacts."
        columns:
          - name: BusinessEntityID
            description: "Primary key for Person records."
          - name: PersonType
            description: "Primary type of person."
          - name: FirstName
            description: "First name of the person."
          - name: MiddleName
            description: "Middle name or middle initial."
          - name: LastName
            description: "Last name of the person."
          - name: EmailPromotion
            description: "Email promotion preference."
          - name: ModifiedDate
            description: "Date and time the record was last updated."
