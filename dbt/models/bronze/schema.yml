version: 2

models:
  - name: brnz_sales_order_header
    description: "1-1 staging view for Sales.SalesOrderHeader with standardized snake_case columns, data types, and audit timestamp."
    columns:
      - name: sales_order_id
        description: "Primary key for sales orders."
        tests:
          - not_null
      - name: revision_number
        description: "Incremental number to track changes to the sales order over time."
      - name: order_date
        description: "Date the sales order was created (DATE)."
      - name: due_date
        description: "Date the order is due to the customer (DATE)."
      - name: ship_date
        description: "Date the order was shipped to the customer (DATE)."
      - name: status
        description: "Order current status integer (1=In Process, 2=Approved, 3=Backordered, 4=Rejected, 5=Shipped, 6=Cancelled)."
      - name: online_order_flag
        description: "Flag indicating whether the order was placed online by the customer (1) or by a sales person (0)."
      - name: sales_order_number
        description: "Unique sales order identification number."
      - name: purchase_order_number
        description: "Customer purchase order number reference."
      - name: account_number
        description: "Financial accounting number reference."
      - name: customer_id
        description: "Customer identification number (foreign key to Sales.Customer)."
      - name: sales_person_id
        description: "Sales person who created the sales order."
      - name: territory_id
        description: "Territory in which the sale was made (foreign key to Sales.SalesTerritory)."
      - name: bill_to_address_id
        description: "Customer billing address identifier."
      - name: ship_to_address_id
        description: "Customer shipping address identifier."
      - name: ship_method_id
        description: "Shipping method identifier."
      - name: sub_total
        description: "Sales subtotal amount (DECIMAL(18, 4))."
      - name: tax_amt
        description: "Tax amount (DECIMAL(18, 4))."
      - name: freight
        description: "Shipping cost (DECIMAL(18, 4))."
      - name: total_due
        description: "Total due from customer: sub_total + tax_amt + freight (DECIMAL(18, 4))."
      - name: modified_date
        description: "Timestamp when the source record was last modified."
      - name: loaded_at
        description: "Audit timestamp when the record was loaded into the bronze layer."

  - name: brnz_sales_order_detail
    description: "1-1 staging view for Sales.SalesOrderDetail with standardized columns, coalesced numerics, and audit timestamp."
    columns:
      - name: sales_order_id
        description: "Foreign key to SalesOrderHeader.sales_order_id."
        tests:
          - not_null
      - name: sales_order_detail_id
        description: "Line item identifier within a sales order."
        tests:
          - not_null
      - name: carrier_tracking_number
        description: "Shipment tracking number supplied by the shipper."
      - name: order_qty
        description: "Quantity ordered per product."
      - name: product_id
        description: "Product sold to customer (foreign key to Production.Product)."
      - name: special_offer_id
        description: "Promotional code / special offer identifier."
      - name: unit_price
        description: "Selling price of a single product (DECIMAL(18, 4))."
      - name: unit_price_discount
        description: "Discount percentage applied to unit price, coalesced to 0 (DECIMAL(18, 4))."
      - name: line_total
        description: "Source per-product subtotal (DECIMAL(18, 4))."
      - name: modified_date
        description: "Timestamp when the source record was last modified."
      - name: loaded_at
        description: "Audit timestamp when the record was loaded into the bronze layer."

  - name: brnz_products
    description: "1-1 staging view for Production.Product with standardized columns and types."
    columns:
      - name: product_id
        description: "Primary key for Product records."
        tests:
          - not_null
      - name: product_name
        description: "Name of the product."
      - name: product_number
        description: "Unique product identification number (SKU)."
      - name: make_flag
        description: "0 = Product is purchased, 1 = Product is manufactured in-house."
      - name: finished_goods_flag
        description: "0 = Product is not a salable item, 1 = Product is salable."
      - name: color
        description: "Product color."
      - name: safety_stock_level
        description: "Minimum inventory quantity."
      - name: reorder_point
        description: "Inventory level that triggers a purchase order or work order."
      - name: standard_cost
        description: "Standard cost of the product (DECIMAL(18, 4))."
      - name: list_price
        description: "Selling list price (DECIMAL(18, 4))."
      - name: size
        description: "Product size."
      - name: product_line
        description: "R = Road, M = Mountain, T = Touring, S = Standard."
      - name: product_class
        description: "H = High, M = Medium, L = Low."
      - name: product_style
        description: "W = Womens, M = Mens, U = Universal."
      - name: product_subcategory_id
        description: "Foreign key to Production.ProductSubcategory."
      - name: product_model_id
        description: "Foreign key to Production.ProductModel."
      - name: sell_start_date
        description: "Date the product was available for sale."
      - name: sell_end_date
        description: "Date the product was no longer available for sale."
      - name: discontinued_date
        description: "Date the product was discontinued."
      - name: modified_date
        description: "Timestamp when the source record was last modified."
      - name: loaded_at
        description: "Audit timestamp when the record was loaded into the bronze layer."

  - name: brnz_product_subcategories
    description: "1-1 staging view for Production.ProductSubcategory."
    columns:
      - name: product_subcategory_id
        description: "Primary key for ProductSubcategory records."
        tests:
          - not_null
      - name: product_category_id
        description: "Foreign key to Production.ProductCategory."
      - name: subcategory_name
        description: "Product subcategory name."
      - name: modified_date
        description: "Timestamp when the source record was last modified."
      - name: loaded_at
        description: "Audit timestamp when the record was loaded into the bronze layer."

  - name: brnz_product_categories
    description: "1-1 staging view for Production.ProductCategory."
    columns:
      - name: product_category_id
        description: "Primary key for ProductCategory records."
        tests:
          - not_null
      - name: category_name
        description: "Product category name."
      - name: modified_date
        description: "Timestamp when the source record was last modified."
      - name: loaded_at
        description: "Audit timestamp when the record was loaded into the bronze layer."

  - name: brnz_sales_territories
    description: "1-1 staging view for Sales.SalesTerritory."
    columns:
      - name: territory_id
        description: "Primary key for SalesTerritory records."
        tests:
          - not_null
      - name: territory_name
        description: "Sales territory name."
      - name: country_region_code
        description: "ISO standard country or region code."
      - name: territory_group
        description: "Geographic group to which the sales territory belongs."
      - name: sales_ytd
        description: "Sales in the territory year to date (DECIMAL(18, 4))."
      - name: sales_last_year
        description: "Sales in the territory the previous year (DECIMAL(18, 4))."
      - name: cost_ytd
        description: "Business costs in the territory year to date (DECIMAL(18, 4))."
      - name: cost_last_year
        description: "Business costs in the territory the previous year (DECIMAL(18, 4))."
      - name: modified_date
        description: "Timestamp when the source record was last modified."
      - name: loaded_at
        description: "Audit timestamp when the record was loaded into the bronze layer."

  - name: brnz_customers
    description: "1-1 staging view for Sales.Customer."
    columns:
      - name: customer_id
        description: "Primary key for Customer records."
        tests:
          - not_null
      - name: person_id
        description: "Foreign key to Person.Person.business_entity_id."
      - name: store_id
        description: "Foreign key to Sales.Store.business_entity_id."
      - name: territory_id
        description: "Foreign key to Sales.SalesTerritory.territory_id."
      - name: account_number
        description: "Unique customer account number."
      - name: modified_date
        description: "Timestamp when the source record was last modified."
      - name: loaded_at
        description: "Audit timestamp when the record was loaded into the bronze layer."

  - name: brnz_persons
    description: "1-1 staging view for Person.Person."
    columns:
      - name: business_entity_id
        description: "Primary key for Person records."
        tests:
          - not_null
      - name: person_type
        description: "Primary type of person (SC, IN, SP, EM, VC, GC)."
      - name: name_style
        description: "0 = Western name style, 1 = Eastern name style."
      - name: title
        description: "Courtesy title (e.g. Mr., Ms.)."
      - name: first_name
        description: "First name of the person."
      - name: middle_name
        description: "Middle name or initial."
      - name: last_name
        description: "Last name of the person."
      - name: suffix
        description: "Surname suffix."
      - name: email_promotion
        description: "Email promotion preference flag (0, 1, 2)."
      - name: modified_date
        description: "Timestamp when the source record was last modified."
      - name: loaded_at
        description: "Audit timestamp when the record was loaded into the bronze layer."

  - name: brnz_stores
    description: "1-1 staging view for Sales.Store."
    columns:
      - name: business_entity_id
        description: "Primary key for Store records."
        tests:
          - not_null
      - name: store_name
        description: "Name of the store."
      - name: sales_person_id
        description: "ID of the sales person assigned to the store."
      - name: modified_date
        description: "Timestamp when the source record was last modified."
      - name: loaded_at
        description: "Audit timestamp when the record was loaded into the bronze layer."
