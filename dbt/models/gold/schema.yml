version: 2

models:
  - name: dim_date
    description: "Calendar date dimension covering 2011-2015 for time-series analysis."
    columns:
      - name: date_key
        description: "Integer surrogate date key (YYYYMMDD)."
        tests:
          - unique
          - not_null
      - name: full_date
        description: "Calendar date."
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Gold product dimension with category hierarchy and pricing."
    columns:
      - name: product_id
        description: "Primary key for product dimension."
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name."
      - name: category_name
        description: "Top-level product category."
      - name: subcategory_name
        description: "Product subcategory."

  - name: dim_customers
    description: "Gold customer dimension combining individual and store customers."
    columns:
      - name: customer_id
        description: "Primary key for customer dimension."
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Customer or store display name."
      - name: customer_type
        description: "Store or Individual."

  - name: dim_territories
    description: "Gold sales territory dimension."
    columns:
      - name: territory_id
        description: "Primary key for territory dimension."
        tests:
          - unique
          - not_null
      - name: territory_name
        description: "Territory name."
      - name: country_region_code
        description: "Country/region ISO code."

  - name: fct_sales
    description: "Gold sales fact table at order line-item grain (excludes cancelled orders)."
    columns:
      - name: order_item_sk
        description: "Unique surrogate key for each sales order line item."
        tests:
          - unique
          - not_null
      - name: order_date_key
        description: "Foreign key to dim_date.date_key."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: product_id
        description: "Foreign key to dim_products.product_id."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: customer_id
        description: "Foreign key to dim_customers.customer_id."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: territory_id
        description: "Foreign key to dim_territories.territory_id."
        tests:
          - relationships:
              to: ref('dim_territories')
              field: territory_id
      - name: net_line_amount
        description: "Net line revenue after discount."
      - name: line_cogs
        description: "Cost of goods sold for the line item."
      - name: line_gross_profit
        description: "Gross profit for the line item."

  - name: gld_mart_sales_by_territory
    description: "Monthly sales performance mart by country and territory for BI dashboards."
    columns:
      - name: order_month
        description: "First day of the order month."
        tests:
          - not_null
      - name: territory_id
        description: "Sales territory identifier."
        tests:
          - not_null
      - name: country_region_code
        description: "ISO country/region code."
      - name: territory_name
        description: "Sales territory name."
      - name: total_orders
        description: "Distinct count of valid sales orders."
      - name: total_units_sold
        description: "Total quantity of units sold."
      - name: gross_revenue
        description: "Total gross revenue before discounts."
      - name: total_discount
        description: "Total discount amount given."
      - name: net_revenue
        description: "Total net revenue after discounts."
      - name: avg_order_value
        description: "Average order value (net_revenue / total_orders)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_month
            - territory_id

  - name: gld_mart_product_profitability
    description: "Product-level profitability and sales velocity mart."
    columns:
      - name: product_id
        description: "Unique product identifier."
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name."
      - name: category_name
        description: "Product category."
      - name: subcategory_name
        description: "Product subcategory."
      - name: times_ordered
        description: "Distinct count of orders containing this product."
      - name: total_qty_sold
        description: "Total units sold."
      - name: net_revenue
        description: "Total net revenue."
      - name: total_cogs
        description: "Total cost of goods sold."
      - name: gross_profit
        description: "Total gross profit (net_revenue - total_cogs)."
      - name: gross_margin_pct
        description: "Gross profit margin percentage."

  - name: gld_mart_customer_rfm_analytics
    description: "Customer RFM (Recency, Frequency, Monetary) segmentation mart for CRM & Marketing."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - unique
          - not_null
      - name: recency_days
        description: "Days elapsed since the customer's last valid order relative to dataset max date."
      - name: frequency
        description: "Total distinct valid orders placed by the customer."
      - name: monetary
        description: "Total net spend by the customer."
      - name: customer_segment
        description: "RFM customer segment (VIP, Loyal, Potential Loyalist, At Risk, Churned)."
        tests:
          - accepted_values:
              values: ['VIP', 'Loyal', 'Potential Loyalist', 'At Risk', 'Churned']
