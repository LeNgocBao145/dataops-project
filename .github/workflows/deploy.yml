name: Deploy to Environments

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - test
          - production

env:
  DBT_PROFILES_DIR: ./dbt

jobs:
  deploy-test:
    name: Deploy to Test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Start SQL Server Container
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
        run: |
          docker run -d --name sqlserver_test -p 1433:1433 \
            -e "ACCEPT_EULA=Y" \
            -e "SA_PASSWORD=$SA_PASSWORD" \
            mcr.microsoft.com/mssql/server:2019-latest

          # Wait for SQL Server to be healthy
          echo "Waiting for SQL Server to be ready..."
          for i in {1..30}; do
            if docker exec -e SA_PASSWORD="$SA_PASSWORD" sqlserver_test bash -c '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" 2>/dev/null'; then
              echo "SQL Server is ready!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 2
          done

      - name: Install dependencies
        run: |
          pip install dbt-sqlserver pyodbc

      - name: Setup Test Database and User
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
          TEST_USER: ${{ secrets.TEST_SQL_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_SQL_PASSWORD }}
        run: |
          curl -L -o /tmp/AdventureWorks2014.bak https://github.com/Microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorks2014.bak
          docker cp /tmp/AdventureWorks2014.bak sqlserver_test:/tmp/AdventureWorks2014.bak
          SQLCMD="docker exec sqlserver_test /opt/mssql-tools18/bin/sqlcmd -C"
          if ! docker exec sqlserver_test test -f /opt/mssql-tools18/bin/sqlcmd; then
            SQLCMD="docker exec sqlserver_test /opt/mssql-tools/bin/sqlcmd"
          fi
          $SQLCMD -S localhost -U sa -P "$SA_PASSWORD" -Q "RESTORE DATABASE AdventureWorks2014 FROM DISK = '/tmp/AdventureWorks2014.bak' WITH MOVE 'AdventureWorks2014_Data' TO '/var/opt/mssql/data/AdventureWorks2014.mdf', MOVE 'AdventureWorks2014_Log' TO '/var/opt/mssql/data/AdventureWorks2014_log.ldf'"
          $SQLCMD -S localhost -U sa -P "$SA_PASSWORD" -Q "RESTORE DATABASE AdventureWorks2014_Test FROM DISK = '/tmp/AdventureWorks2014.bak' WITH MOVE 'AdventureWorks2014_Data' TO '/var/opt/mssql/data/AdventureWorks2014_Test.mdf', MOVE 'AdventureWorks2014_Log' TO '/var/opt/mssql/data/AdventureWorks2014_Test_log.ldf'"
          $SQLCMD -S localhost -U sa -P "$SA_PASSWORD" \
            -v DB_USER="$TEST_USER" -v DB_PASS="$TEST_PASSWORD" \
            -Q "IF NOT EXISTS (SELECT * FROM sys.server_principals WHERE name = '$(DB_USER)') CREATE LOGIN [$(DB_USER)] WITH PASSWORD = '$(DB_PASS)'; USE AdventureWorks2014; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$(DB_USER)') CREATE USER [$(DB_USER)] FOR LOGIN [$(DB_USER)]; ALTER ROLE db_owner ADD MEMBER [$(DB_USER)]; USE AdventureWorks2014_Test; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$(DB_USER)') CREATE USER [$(DB_USER)] FOR LOGIN [$(DB_USER)]; ALTER ROLE db_owner ADD MEMBER [$(DB_USER)];"

      - name: Run deployment
        env:
          TEST_SQL_SERVER: ${{ secrets.TEST_SQL_SERVER }}
          TEST_SQL_USER: ${{ secrets.TEST_SQL_USER }}
          TEST_SQL_PASSWORD: ${{ secrets.TEST_SQL_PASSWORD }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh test test

      - name: Run smoke tests
        env:
          SQL_SERVER: ${{ secrets.TEST_SQL_SERVER }}
          SQL_USER: ${{ secrets.TEST_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.TEST_SQL_PASSWORD }}
        run: |
          python scripts/smoke_tests.py --database AdventureWorks2014_Test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-deployment
          path: |
            dbt/target/
            backups/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Start SQL Server Container
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
        run: |
          docker run -d --name sqlserver_prod -p 1433:1433 \
            -e "ACCEPT_EULA=Y" \
            -e "SA_PASSWORD=$SA_PASSWORD" \
            mcr.microsoft.com/mssql/server:2019-latest

          # Wait for SQL Server to be healthy
          echo "Waiting for SQL Server to be ready..."
          for i in {1..30}; do
            if docker exec -e SA_PASSWORD="$SA_PASSWORD" sqlserver_prod bash -c '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" 2>/dev/null'; then
              echo "SQL Server is ready!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 2
          done

      - name: Install dependencies
        run: |
          pip install dbt-sqlserver pyodbc

      - name: Setup Production Database and User
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
          PROD_USER: ${{ secrets.PROD_SQL_USER }}
          PROD_PASSWORD: ${{ secrets.PROD_SQL_PASSWORD }}
        run: |
          curl -L -o /tmp/AdventureWorks2014.bak https://github.com/Microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorks2014.bak
          docker cp /tmp/AdventureWorks2014.bak sqlserver_prod:/tmp/AdventureWorks2014.bak
          SQLCMD="docker exec sqlserver_prod /opt/mssql-tools18/bin/sqlcmd -C"
          if ! docker exec sqlserver_prod test -f /opt/mssql-tools18/bin/sqlcmd; then
            SQLCMD="docker exec sqlserver_prod /opt/mssql-tools/bin/sqlcmd"
          fi
          $SQLCMD -S localhost -U sa -P "$SA_PASSWORD" -Q "RESTORE DATABASE AdventureWorks2014 FROM DISK = '/tmp/AdventureWorks2014.bak' WITH MOVE 'AdventureWorks2014_Data' TO '/var/opt/mssql/data/AdventureWorks2014.mdf', MOVE 'AdventureWorks2014_Log' TO '/var/opt/mssql/data/AdventureWorks2014_log.ldf'"
          $SQLCMD -S localhost -U sa -P "$SA_PASSWORD" -Q "RESTORE DATABASE AdventureWorks2014_Prod FROM DISK = '/tmp/AdventureWorks2014.bak' WITH MOVE 'AdventureWorks2014_Data' TO '/var/opt/mssql/data/AdventureWorks2014_Prod.mdf', MOVE 'AdventureWorks2014_Log' TO '/var/opt/mssql/data/AdventureWorks2014_Prod_log.ldf'"
          $SQLCMD -S localhost -U sa -P "$SA_PASSWORD" \
            -v DB_USER="$PROD_USER" -v DB_PASS="$PROD_PASSWORD" \
            -Q "IF NOT EXISTS (SELECT * FROM sys.server_principals WHERE name = '$(DB_USER)') CREATE LOGIN [$(DB_USER)] WITH PASSWORD = '$(DB_PASS)'; USE AdventureWorks2014; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$(DB_USER)') CREATE USER [$(DB_USER)] FOR LOGIN [$(DB_USER)]; ALTER ROLE db_owner ADD MEMBER [$(DB_USER)]; USE AdventureWorks2014_Prod; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '$(DB_USER)') CREATE USER [$(DB_USER)] FOR LOGIN [$(DB_USER)]; ALTER ROLE db_owner ADD MEMBER [$(DB_USER)];"

      - name: Run deployment
        env:
          PROD_SQL_SERVER: ${{ secrets.PROD_SQL_SERVER }}
          PROD_SQL_USER: ${{ secrets.PROD_SQL_USER }}
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_PASSWORD }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh production prod

      - name: Run smoke tests
        env:
          SQL_SERVER: ${{ secrets.PROD_SQL_SERVER }}
          SQL_USER: ${{ secrets.PROD_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.PROD_SQL_PASSWORD }}
        run: |
          python scripts/smoke_tests.py --database AdventureWorks2014_Prod

      - name: Notify team
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Deployment to production completed with status: $JOB_STATUS"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            COLOR="good"
            [ "$JOB_STATUS" != "success" ] && COLOR="danger"
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"attachments\":[{\"color\":\"$COLOR\",\"title\":\"Production Deployment: $JOB_STATUS\",\"text\":\"Commit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL secret not set. Skipping Slack notification."
          fi
